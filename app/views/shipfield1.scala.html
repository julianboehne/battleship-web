@(title: String)

<!DOCTYPE html>
<html lang="en">
  <head>
    @* Here's where we render the page title `String`. *@
    <title>@title</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap&#64;5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/bootstrap.css")">
    <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/main.css")">
    <link rel="shortcut icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">

  </head>
  <body>



    <div id="app">
      <h1>{{ title }}</h1>
        <!-- Vue.js-verwaltetes Spielfeld -->
      <h2 class="text-primary">Player 1</h2>
      <table id="player1-board">
        <tr>
          <td></td>
          <td v-for="(letter, index) in boardLetters" :key="index">{{ letter }}</td>
        </tr>
        <tr v-for="(row, rowIndex) in size" :key="rowIndex">
          <td>{{ row }}</td>
          <td v-for="(col, colIndex) in size" :key="colIndex">
            <button
            class="shipButton1 btn btn-outline-primary"
            @@click="placeShip(row, col)"
            >
            <span v-if="isShipAtPosition(col, row)">🚢</span>
            <span v-else>{{ getCellContent(col, row) }}</span>
            </button>
          </td>
        </tr>
      </table>
      Ships_x: {{ ships_x }}
      Ships_y: {{ ships_y }}
      Size: {{ size }}
      Title: {{ title }}
      Board: {{ board }}
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap&#64;5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="@routes.Assets.versioned("javascripts/shipfield.js")" type="text/javascript"></script>
    <script src="@routes.Assets.versioned("javascripts/main.js")" type="text/javascript"></script>
    <script src="https://unpkg.com/vue&#64;3/dist/vue.global.js"></script>

    <script>
            const app = Vue.createApp({
              data() {
                return {
                  title: "Battleship Grid",
                  size: 10,
                  board: [],
                  ships_x: [],
                  ships_y: [],
                };
              },
              computed: {
                boardLetters() {
                  return Array.from({ length: this.size }, (_, i) => String.fromCharCode(65 + i));
                },
              },
              mounted() {
                this.fetchGameData();
              },
              methods: {
                async fetchGameData() {
                  try {
                    const response = await fetch('/game/addShips1json');
                    const data = await response.json();

                    this.title = data.title;
                    this.size = data.size;
                    this.board = data.board;
                    this.ships_x = data.ships_x;
                    this.ships_y = data.ships_y;
                  } catch (error) {
                    console.error('Error fetching game data:', error);
                  }
                },
                isShipAtPosition(col, row) {
                  for (let i = 0; i < this.ships_x.length; i++) {
                    if (this.ships_x[i] === col && this.ships_y[i] === row) {
                      return true;
                    }
                  }
                  return false;
                },
                getCellContent(col, row) {
                  const index = (row - 1) * this.size + (col - 1);
                  return this.board[index] !== '.' ? this.board[index] : '';
                },
                async placeShip(row, col) {
                  try {
                    const response = await fetch(`/game/player1/addShip`, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                      },
                      body: JSON.stringify({ row, col }),
                    });

                    const data = await response.json();
                    console.log('Ship placed:', data);
                    this.ships_x.push(col);
                    this.ships_y.push(row);
                  } catch (error) {
                    console.error('Error placing ship:', error);
                  }
                },
              },
            });

            app.mount('#app');
    </script>






  </body>
</html>
