apiVersion: apps/v1
kind: Deployment
metadata:
  name: battleship-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: battleship-backend
          image: battleship/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000

---

apiVersion: v1
kind: Service
metadata:
  name: battleship-backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000